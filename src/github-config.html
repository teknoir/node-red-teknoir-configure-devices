<script type="text/html" data-template-name="github-config">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-config-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-config-input-token"><i class="fa fa-lock"></i> Personal Access Token</label>
        <input type="password" id="node-config-input-token">
    </div>
</script>

<script type="text/html" data-help-name="github-config">
    <p>Configuration for GitHub authentication.</p>
    <p>Use a <b>Personal Access Token</b> for simple read access to private repositories.</p>
</script>

<script type="text/javascript">
    RED.nodes.registerType('github-config',{
        category: 'config',
        defaults: {
            name: {value:""}
        },
        credentials: {
            token: {type:"password"}
        },
        label: function() {
            return this.name || "GitHub Credentials";
        }
    });
</script>
